name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'setup/**'
      - 'infra/**'

env:
  YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Yandex Cloud CLI
        run: curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
      
      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize in Yandex Cloud
        run: |
          echo "$YC_SA_KEY" > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init and Apply (Setup)
        working-directory: ./setup
        run: |
          terraform init
          terraform apply -auto-approve -var="yc_access_key=$AWS_ACCESS_KEY_ID" -var="yc_secret_key=$AWS_SECRET_ACCESS_KEY"

      - name: Terraform Init and Apply (Infra)
        working-directory: ./infra
        run: |
          terraform init
          terraform apply -auto-approve
