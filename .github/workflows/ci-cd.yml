name: Build and Deploy App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate YC CLI
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > /tmp/key.json
          yc config profile create sa-profile
          yc config set service-account-key /tmp/key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set cloud-id $(yc resource-manager folder get ${{ secrets.YC_FOLDER_ID }} --format json | jq -r '.cloud_id')

      - name: Login to Yandex Container Registry
        run: |
          yc cr configure-docker

      - name: Build Docker image
        run: |
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:${{ github.ref_name }} ./app
          docker tag cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:${{ github.ref_name }} cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:latest

      - name: Push Docker image
        run: |
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:${{ github.ref_name }}
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:latest

      - name: Setup kubectl
        run: |
          sudo snap install kubectl --classic
          yc managed-kubernetes cluster get-credentials --id ${{ secrets.YC_CLUSTER_ID }} --external

      - name: Deploy to Kubernetes
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          sed -i "s|image:.*|image: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:${IMAGE_TAG}|g" k8s/app/deployment.yaml
          kubectl apply -f k8s/app/
