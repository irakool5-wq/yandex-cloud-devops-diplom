name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  YC_CLUSTER_ID: ${{ secrets.YC_CLUSTER_ID }}
  IMAGE_TAG: ${{ github.ref_name == 'main' && github.sha || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Yandex Cloud CLI
        run: curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash

      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize in Yandex Cloud
        run: |
          echo "$YC_SA_KEY" > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json

      - name: Configure Docker for Yandex Container Registry
        run: yc container registry configure-docker

      - name: Build Docker image
        run: docker build --platform linux/amd64 --provenance=false --sbom=false -t cr.yandex/$YC_REGISTRY_ID/app:$IMAGE_TAG app/

      - name: Push Docker image
        run: docker push cr.yandex/$YC_REGISTRY_ID/app:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Yandex Cloud CLI and jq
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          sudo apt-get update && sudo apt-get install -y jq

      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize in Yandex Cloud
        run: |
          echo "$YC_SA_KEY" > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json

      - name: Setup SSH Tunnel to Private K8s Master
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
          
          # Получаем внутренний IP мастера Kubernetes
          CLUSTER_INFO=$(yc managed-kubernetes cluster get --id $YC_CLUSTER_ID --format json)
          echo "Cluster info: $CLUSTER_INFO" | jq .
          
          MASTER_IP=$(echo "$CLUSTER_INFO" | jq -r '.master.internal_v4_address')
          echo "Master IP: $MASTER_IP"
          
          if [ -z "$MASTER_IP" ] || [ "$MASTER_IP" = "null" ]; then
            echo "ERROR: Could not get master internal IP"
            exit 1
          fi
          
          echo "Connecting to Master at $MASTER_IP via Bastion ${{ secrets.BASTION_IP }}"
          
          # Запускаем SSH-туннель в фоновом режиме
          ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -L 6443:$MASTER_IP:443 ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_IP }} -N -f
          sleep 5
          echo "SSH tunnel established"

      - name: Get K8s credentials and fix endpoint
        run: |
          # Получаем конфиг для внутреннего доступа
          yc managed-kubernetes cluster get-credentials --id $YC_CLUSTER_ID --internal --force
          # Подменяем адрес сервера на локальный конец туннеля
          sed -i 's|server: https://.*|server: https://127.0.0.1:6443|' ~/.kube/config
          echo "Kubeconfig updated to use tunnel"

      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|image: cr.yandex/.*/app:.*|image: cr.yandex/$YC_REGISTRY_ID/app:$IMAGE_TAG|g" k8s/app/deployment.yaml

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/app/
