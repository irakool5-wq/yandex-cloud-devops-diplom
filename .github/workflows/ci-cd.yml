name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  YC_CLUSTER_ID: ${{ secrets.YC_CLUSTER_ID }}
  IMAGE_TAG: ${{ github.ref_name == 'main' && github.sha || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Yandex Cloud CLI
        run: curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash

      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize in Yandex Cloud
        run: |
          echo "$YC_SA_KEY" > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json

      - name: Configure Docker for Yandex Container Registry
        run: yc container registry configure-docker

      - name: Build Docker image
        run: docker build --platform linux/amd64 --provenance=false --sbom=false -t cr.yandex/$YC_REGISTRY_ID/app:$IMAGE_TAG app/

      - name: Push Docker image
        run: docker push cr.yandex/$YC_REGISTRY_ID/app:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Yandex Cloud CLI
        run: curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash

      - name: Add YC CLI to PATH
        run: echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize in Yandex Cloud
        run: |
          echo "$YC_SA_KEY" > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json

      - name: Get K8s credentials and extract internal Master IP
        run: |
          # Получаем конфиг для внутреннего доступа (он создаст файл ~/.kube/config)
          yc managed-kubernetes cluster get-credentials --id $YC_CLUSTER_ID --internal --force
          
          # Извлекаем внутренний IP мастера из сгенерированного kubeconfig
          # Строка выглядит как: server: https://192.168.10.25:443
          SERVER_URL=$(awk '/server:/ {print $2; exit}' ~/.kube/config)
          MASTER_IP=$(echo $SERVER_URL | sed -e 's|https://||' -e 's|:.*||')
          
          echo "Extracted Master Internal IP: $MASTER_IP"
          
          if [ -z "$MASTER_IP" ]; then
            echo "ERROR: Could not extract Master IP from kubeconfig"
            exit 1
          fi
          
          # Сохраняем IP в переменную окружения для следующего шага
          echo "MASTER_IP=$MASTER_IP" >> $GITHUB_ENV

      - name: Setup SSH Tunnel to Private K8s Master
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
          
          echo "Setting up tunnel to $MASTER_IP via Bastion ${{ secrets.BASTION_IP }}"
          
          # Запускаем SSH-туннель в фоновом режиме: локальный 6443 -> Бастион -> Мастер:443
          ssh -i ~/.ssh/bastion_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3 \
              -L 6443:$MASTER_IP:443 \
              ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_IP }} -N -f &
          
          sleep 5
          echo "SSH tunnel established successfully"

      - name: Fix Kubeconfig to use local tunnel
        run: |
          # Подменяем адрес сервера на локальный конец туннеля
          sed -i 's|server: https://.*|server: https://127.0.0.1:6443|' ~/.kube/config
          echo "Kubeconfig updated to use tunnel at 127.0.0.1:6443"

      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|image: cr.yandex/.*/app:.*|image: cr.yandex/$YC_REGISTRY_ID/app:$IMAGE_TAG|g" k8s/app/deployment.yaml

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/app/
