name: CI/CD Application

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Yandex Cloud CLI
        uses: yc-actions/yc-github-actions@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}

      - name: Login to Yandex Container Registry
        run: |
          yc container registry configure-docker

      - name: Build and Push Docker Image
        env:
          REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/app
          TAG: ${{ github.ref_name }}
        run: |
          docker build -t $REGISTRY:$TAG -t $REGISTRY:latest ./app
          docker push $REGISTRY:$TAG
          docker push $REGISTRY:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update Deployment Image
        env:
          REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/app
          TAG: ${{ github.ref_name }}
        run: |
          sed -i "s|image: cr.yandex/.*/app:.*|image: $REGISTRY:$TAG|g" k8s/app/deployment.yaml

      - name: Deploy to Kubernetes
        env:
          YC_CLUSTER_ID: ${{ secrets.YC_CLUSTER_ID }}
        run: |
          yc managed-kubernetes cluster get-credentials --id $YC_CLUSTER_ID --external
          kubectl apply -f k8s/app/
